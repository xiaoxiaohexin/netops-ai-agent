[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langgraph-netagent"
version = "0.1.0"
description = "LangGraph Network Automation and Self-Healing Agent Prototype"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Network Automation Team" }
]
dependencies = [
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "typing-extensions>=4.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
netagent = "langgraph_netagent.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["langgraph_netagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "--basetemp=.pytest_temp"
filterwarnings = [
    "ignore::DeprecationWarning",
]

