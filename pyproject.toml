[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netops-ai-agent"
version = "0.1.0"
description = "NetOps AI Agent: Telemetry-driven Network Operations, Troubleshooting and Self-Healing Agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "xiaoxiaohexin" }
]
dependencies = [
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "typing-extensions>=4.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
netagent = "langgraph_netagent.cli:main"

[tool.setuptools.packages.find]
where = ["langgraph_netagent"]
include = ["langgraph_netagent*"]
